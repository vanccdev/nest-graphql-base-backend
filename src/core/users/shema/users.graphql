type Query {
  users: SuccessResponseUsers!
  user(idUser: ID!): SuccessResponseUser!
  filterUsers(
    limite: Int
    saltar: Int
    filtro: String
    orden: String
    sentido: String
  ): SuccessResponseUsers!
}

type Mutation {
  createUser(createUserInput: CreateUserInput!): SuccessResponseUser!
  updateUser(
    idUser: String!
    updateUserInput: UpdateUserInput!
  ): SuccessResponseUser!
  deleteUser(idUser: String!): SuccessResponseDelete!
}

"""
Respuesta estándar exitosa con un solo usuario
"""
type SuccessResponseUser {
  """
  Indica si la operación finalizó correctamente
  """
  finalizado: Boolean!

  """
  Mensaje descriptivo de la operación
  """
  mensaje: String!

  """
  Datos del usuario
  """
  datos: User!
}

"""
Respuesta estándar exitosa con datos de usuarios paginados
"""
type SuccessResponseUsers {
  """
  Indica si la operación finalizó correctamente
  """
  finalizado: Boolean!

  """
  Mensaje descriptivo de la operación
  """
  mensaje: String!

  """
  Datos paginados de usuarios
  """
  datos: PaginatedUsersData!
}

"""
Respuesta estándar para operaciones de eliminación
"""
type SuccessResponseDelete {
  """
  Indica si la operación finalizó correctamente
  """
  finalizado: Boolean!

  """
  Mensaje descriptivo de la operación
  """
  mensaje: String!

  """
  Datos de la eliminación
  """
  datos: DeleteUserData!
}

"""
Datos de usuario eliminado
"""
type DeleteUserData {
  idUser: ID!
}

"""
Datos paginados de usuarios
"""
type PaginatedUsersData {
  """
  Lista de usuarios encontrados
  """
  filas: [User!]!

  """
  Total de registros que cumplen con los filtros
  """
  total: Int!
}

"""
Representa un usuario del sistema
"""
type User {
  id: ID

  """
  Nombre de usuario (usualmente CI)
  """
  userName: String

  """
  Correo electrónico del usuario
  """
  email: String

  """
  Número de intentos fallidos de login
  """
  attempts: Int

  # ===== Auditoría =====
  """
  Estado lógico del registro
  """
  status: String

  """
  Tipo de transacción realizada (CREAR, ACTUALIZAR, etc)
  """
  transaction: String

  """
  ID del usuario que creó el registro
  """
  userCreation: ID

  """
  Fecha de creación del registro
  """
  dateCreation: String

  """
  ID del usuario que modificó el registro
  """
  userModification: ID

  """
  Fecha de la última modificación
  """
  dateModification: String

  """
  Fecha de eliminación lógica
  """
  dateDelete: String
}

"""
Datos necesarios para crear un usuario
"""
input CreateUserInput {
  userName: String!
  password: String!
  email: String!
  userCreation: String
}

"""
Datos necesarios para actualizar un usuario
"""
input UpdateUserInput {
  password: String
  email: String
  attempts: Int
  status: String
  userModification: String
}
